<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Peoria — Reporte Diario</title>
<meta name="theme-color" content="#0B5A63">
<meta name="description" content="Reporte diario de campo — Peoria (Pusey), United Services LLC">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Peoria">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&display=swap">

<style>
:root{
  --paper:#F6F5F2; --surface:#FFFFFF; --sunk:#ECEAE5;
  --ink:#14171A; --ink-2:#4C5257; --ink-3:#7C8288;
  --rule:#DAD7D1; --rule-2:#B9B5AE;
  --pri:#0B5A63; --pri-ink:#FFFFFF; --pri-soft:#E0EDEC;
  --go:#1B6B47; --go-soft:#DFEDE5;
  --warn:#95560A; --warn-soft:#F8EBD8;
  --bad:#9E2B22; --bad-soft:#F8E2DF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101315; --surface:#1A1E21; --sunk:#0A0D0E;
    --ink:#EDEBE6; --ink-2:#AAB0B5; --ink-3:#7C8288;
    --rule:#2A3033; --rule-2:#454B50;
    --pri:#57BCC2; --pri-ink:#08282B; --pri-soft:#122F31;
    --go:#63BC90; --go-soft:#12291F;
    --warn:#DCA04A; --warn-soft:#2B2210;
    --bad:#E27A70; --bad-soft:#2E1917;
  }
}
:root[data-theme="dark"]{
  --paper:#101315; --surface:#1A1E21; --sunk:#0A0D0E;
  --ink:#EDEBE6; --ink-2:#AAB0B5; --ink-3:#7C8288;
  --rule:#2A3033; --rule-2:#454B50;
  --pri:#57BCC2; --pri-ink:#08282B; --pri-soft:#122F31;
  --go:#63BC90; --go-soft:#12291F;
  --warn:#DCA04A; --warn-soft:#2B2210;
  --bad:#E27A70; --bad-soft:#2E1917;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
#app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
  background:var(--paper)}

/* ---------- top bar ---------- */
.top{
  display:grid; grid-template-columns:52px 1fr 52px; align-items:center;
  border-bottom:1px solid var(--rule); background:var(--surface);
  position:sticky; top:0; z-index:20;
}
.top button{
  background:none; border:0; color:var(--ink-2); font:inherit; font-size:15px;
  height:54px; cursor:pointer; padding:0;
}
.top button:active{background:var(--sunk)}
.top .mid{text-align:center; font-size:13px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600}
.top .lang{font-weight:700; font-size:14px; letter-spacing:.04em}

/* ---------- body ---------- */
main{flex:1; padding:24px 18px 20px; display:flex; flex-direction:column; gap:18px}
h1.q{
  font-family:Archivo,system-ui,sans-serif; font-weight:700;
  font-size:27px; line-height:1.15; letter-spacing:-.02em; margin:0; text-wrap:balance;
}
p.hint{margin:0; color:var(--ink-2); font-size:15.5px}

/* ---------- big buttons ---------- */
.grid{display:grid; gap:10px}
.grid.two{grid-template-columns:1fr 1fr}
.grid.three{grid-template-columns:1fr 1fr 1fr}
.big.reason{min-height:58px; font-size:17.5px; justify-content:flex-start; text-align:left}
.big.plus{font-family:Archivo,sans-serif; font-weight:700; font-size:24px; min-height:74px;
  border-color:var(--pri); color:var(--pri)}
.big.plus:active{background:var(--pri-soft)}
.big.clear{font-size:16px; min-height:74px; color:var(--ink-3)}
input.big-num{font-size:42px; padding:14px 8px}
.big{
  display:flex; align-items:center; justify-content:center; gap:10px; text-align:center;
  min-height:66px; padding:14px 16px; border:2px solid var(--rule-2); border-radius:10px;
  background:var(--surface); color:var(--ink); font:inherit; font-weight:600; font-size:19px;
  cursor:pointer; width:100%; line-height:1.25;
}
.big:active{background:var(--sunk)}
.big.sel{border-color:var(--pri); background:var(--pri-soft); color:var(--pri)}
.big .sub{display:block; font-weight:400; font-size:13.5px; color:var(--ink-3); margin-top:3px}
.big.area{min-height:118px; font-family:Archivo,sans-serif; font-weight:700; font-size:46px}
.big.tall{flex-direction:column; gap:0; align-items:flex-start; text-align:left; justify-content:center}
.big:focus-visible{outline:3px solid var(--pri); outline-offset:2px}

/* ---------- chips + stepper ---------- */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  min-width:64px; min-height:56px; padding:0 16px; border:2px solid var(--rule-2); border-radius:10px;
  background:var(--surface); color:var(--ink); font:inherit; font-weight:700; font-size:21px;
  cursor:pointer; font-variant-numeric:tabular-nums;
}
.chip.sel{border-color:var(--pri); background:var(--pri); color:var(--pri-ink)}
.step{display:flex; align-items:center; gap:12px}
.step button{
  width:62px; height:62px; flex:none; border:2px solid var(--rule-2); border-radius:10px;
  background:var(--surface); color:var(--ink); font-size:30px; font-weight:600; line-height:1;
  cursor:pointer;
}
.step button:active{background:var(--sunk)}
.step .val{
  flex:1; text-align:center; font-family:Archivo,sans-serif; font-weight:700; font-size:38px;
  font-variant-numeric:tabular-nums;
}
.step .val small{display:block; font-family:inherit; font-size:13px; font-weight:400;
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
.step.qty input{flex:1; min-width:0; margin:0}

input.num, input.txt, textarea{
  width:100%; font:inherit; color:var(--ink); background:var(--surface);
  border:2px solid var(--rule-2); border-radius:10px; padding:16px;
}
input.num{font-size:32px; font-weight:700; text-align:center; font-variant-numeric:tabular-nums}
textarea{min-height:110px; resize:vertical; font-size:17px}
input:focus, textarea:focus{outline:none; border-color:var(--pri)}

/* ---------- hours bar ---------- */
.hours{border:2px solid var(--rule); border-radius:10px; background:var(--surface); padding:14px}
.hours .row{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.hours .lab{font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.hours .n{font-family:Archivo,sans-serif; font-weight:700; font-size:24px; font-variant-numeric:tabular-nums}
.hours .n.left{color:var(--warn)}
.hours .n.ok{color:var(--go)}
.track{height:12px; border-radius:6px; background:var(--sunk); overflow:hidden; margin:10px 0 0; display:flex}
.track i{display:block; height:100%; background:var(--pri); border-right:1px solid var(--surface)}
.track i:last-child{border-right:0}
.note-sm{font-size:13.5px; color:var(--ink-3); margin-top:9px; line-height:1.35}
.track i.over{background:var(--bad)}

/* ---------- work lines ---------- */
.line{
  border:2px solid var(--rule); border-radius:10px; background:var(--surface);
  padding:13px 14px; display:flex; flex-direction:column; gap:10px;
}
.line .t{font-weight:600; font-size:17px; line-height:1.3; padding-right:40px; position:relative}
.line .x{
  position:absolute; top:-4px; right:-4px; width:36px; height:36px; border-radius:8px;
  border:1.5px solid var(--rule-2); background:var(--surface); color:var(--bad);
  font-size:20px; line-height:1; cursor:pointer; font-weight:700;
}
.line .facts{display:flex; gap:16px; flex-wrap:wrap; font-size:14px; color:var(--ink-2)}
.line .facts b{font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}
.hsplit{display:flex; align-items:center; gap:10px; border-top:1px solid var(--rule); padding-top:10px}
.hsplit .cap{font-size:13px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3);
  font-weight:600; flex:1}
.hsplit button{
  width:48px; height:48px; flex:none; border:2px solid var(--rule-2); border-radius:9px;
  background:var(--surface); color:var(--ink); font-size:24px; font-weight:600; line-height:1; cursor:pointer;
}
.hsplit .hv{min-width:54px; text-align:center; font-family:Archivo,sans-serif; font-weight:700;
  font-size:22px; font-variant-numeric:tabular-nums}

/* ---------- bottom bar ---------- */
.bot .go{flex:1}
.bot{
  position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--rule);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom)); display:flex; gap:10px; z-index:20;
}
.go{
  min-height:62px; border:0; border-radius:11px; background:var(--pri); color:var(--pri-ink);
  font:inherit; font-family:Archivo,sans-serif; font-weight:700; font-size:20px; cursor:pointer;
}
.go:active{filter:brightness(.92)}
.go.green{background:var(--go); color:#fff}
.go[disabled]{background:var(--sunk); color:var(--ink-3); cursor:default}
.ghost{
  min-height:62px; padding:0 22px; border:2px solid var(--rule-2); border-radius:11px;
  background:var(--surface); color:var(--ink-2); font:inherit; font-weight:600; font-size:17px; cursor:pointer;
}

/* ---------- notices ---------- */
.tell{
  border-left:4px solid var(--warn); background:var(--warn-soft); color:var(--ink-2);
  padding:12px 14px; border-radius:0 8px 8px 0; font-size:15.5px;
}
.tell.bad{border-left-color:var(--bad); background:var(--bad-soft)}
.tell.good{border-left-color:var(--go); background:var(--go-soft)}

/* ---------- home ---------- */
.home{align-items:stretch; gap:14px; padding-top:34px}
.brand{text-align:center; margin-bottom:6px}
.brand .plate{
  display:inline-flex; align-items:center; justify-content:center;
  background:#FFFFFF; border-radius:14px; padding:16px 22px;
  box-shadow:0 1px 0 rgba(0,0,0,.06), 0 0 0 1px var(--rule);
}
.brand .plate img{display:block; width:150px; height:auto}
.brand h1{font-family:Archivo,sans-serif; font-weight:700; font-size:29px; margin:8px 0 4px;
  letter-spacing:-.02em}
.brand .when{color:var(--ink-2); font-size:16px}
.stamp{
  text-align:center; font-size:12px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); padding:14px 0 4px;
}

/* ---------- review ---------- */
.rv{border:2px solid var(--rule); border-radius:10px; background:var(--surface); overflow:hidden}
.rv .r{display:grid; grid-template-columns:118px minmax(0,1fr); gap:0 12px;
  padding:12px 14px; border-bottom:1px solid var(--rule); align-items:baseline}
.rv .r:last-child{border-bottom:0}
.rv .k{font-size:12.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.rv .v{font-weight:600; font-size:16.5px; overflow-wrap:break-word}
.rv .v small{display:block; font-weight:400; font-size:14px; color:var(--ink-2); margin-top:2px}
.edit{background:none; border:0; color:var(--pri); font:inherit; font-weight:700; font-size:14px;
  cursor:pointer; padding:2px 0; text-decoration:underline}

/* ---------- sent ---------- */
.sent{align-items:center; justify-content:center; text-align:center; gap:16px; padding-top:60px}
.sent .tick{width:104px; height:104px; border-radius:50%; background:var(--go); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:56px; line-height:1}
.sent h1{font-family:Archivo,sans-serif; font-weight:700; font-size:30px; margin:0}

/* ---------- supervisor ---------- */
.rep{border:2px solid var(--rule); border-radius:10px; background:var(--surface); padding:13px 14px;
  display:flex; flex-direction:column; gap:6px}
.rep .h{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
.rep .h b{font-family:Archivo,sans-serif; font-size:17px}
.rep .h span{font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.rep .d{font-size:14.5px; color:var(--ink-2)}
.rep .acts{display:flex; gap:8px; margin-top:4px}
.rep .acts button{border:1.5px solid var(--rule-2); background:var(--surface); color:var(--ink-2);
  border-radius:8px; padding:8px 12px; font:inherit; font-size:14px; cursor:pointer}
.rep .acts button.del{color:var(--bad); border-color:var(--bad)}
.tot{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:1px; background:var(--rule);
  border:1px solid var(--rule); border-radius:10px; overflow:hidden}
.tot div{background:var(--surface); padding:11px 12px}
.tot .k{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.tot .v{font-family:Archivo,sans-serif; font-weight:700; font-size:21px; font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
/* ---------- job-report additions ---------- */
.qrow{
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 14px; align-items:center;
  border:2px solid var(--rule-2); border-radius:10px; background:var(--surface);
  padding:13px 14px; text-align:left; font:inherit; color:var(--ink); cursor:pointer; min-height:72px;
}
.qrow:active{background:var(--sunk)}
.qrow.has{border-color:var(--pri)}
.qrow .lab{font-weight:600; font-size:16.5px; line-height:1.3}
.qrow .lab small{display:block; font-weight:400; font-size:13px; color:var(--ink-3); margin-top:2px}
.qrow .num{font-family:Archivo,sans-serif; font-weight:700; font-size:30px; font-variant-numeric:tabular-nums;
  color:var(--ink-3); min-width:60px; text-align:right}
.qrow.has .num{color:var(--pri)}
.yn{display:grid; grid-template-columns:minmax(0,1fr) 72px 72px; gap:10px; align-items:center;
  border:2px solid var(--rule); border-radius:10px; background:var(--surface); padding:12px 14px}
.yn .lab{font-weight:600; font-size:16.5px; line-height:1.3}
.yn .chip{min-width:0; padding:0}
.yn .chip.no.sel{border-color:var(--bad); background:var(--bad); color:#fff}
.tchips .chip{font-size:18px; min-width:0; padding:0 12px}
.tchips{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.big.wx{min-height:84px; font-size:19px; font-weight:600}
.big.sel{border-color:var(--pri); background:var(--pri); color:var(--pri-ink)}
.big.stream{justify-content:flex-start; text-align:left; font-size:16.5px; min-height:64px}
</style>
</head>
<body>

    <button id="back" type="button" aria-label="Back">‹</button>

    <button id="lang" class="lang" type="button">EN</button>
  </div>
  <main id="main"></main>
  <div class="bot" id="bot" hidden></div>
</div>

    var f = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",
      day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
    var o = {}; f.formatToParts(d||new Date()).forEach(function(p){ o[p.type]=p.value; });
    if(o.hour === "24") o.hour = "00";
    return o;
  }catch(e){ return null; }
}
function siteISO(d){
  var o = parts(d); if(!o) { var x = d||new Date();
    return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
  return o.year+"-"+o.month+"-"+o.day;
}
function siteTime(d){ var o = parts(d); return o ? o.hour+":"+o.minute : ""; }
function today(){ return siteISO(); }

function shiftHrs(r){ r = r||R; var m = (r.end - r.start); if(m < 0) m += 24*60; return Math.round(m/60*100)/100; }
function totalHrs(r){ r = r||R; return Math.round((r.men||0) * shiftHrs(r) * 100)/100; }
function anyQty(r){ r = r||R; for(var k in r.q) if(r.q[k] > 0) return true; return false; }
function pallets(n){ var p = n / MODULES_PER_PALLET; return (n > 0 && Math.abs(p - Math.round(p)) < 1e-9) ? Math.round(p) : 0; }

/* ---- time helpers (minutes since midnight) ---- */
function clock12(m){
  m = ((m % 1440) + 1440) % 1440;
  var h = Math.floor(m/60), mi = m % 60, ap = h >= 12 ? "PM" : "AM";
  var h12 = h % 12; if(h12 === 0) h12 = 12;
  return h12 + ":" + (mi < 10 ? "0"+mi : mi) + " " + ap;
}
function clockShort(m){ return clock12(m).replace(":00","").replace(" ","\u2009"); }

/* ---- work stream, derived from what was actually done ----
   Same rule the office applied by hand on Input rows 5–17. */
function streamAuto(r){
  r = r||R; var q = r.q;
  var rack = (q.assembled>0 || q.racksLoaded>0 || q.modsLoaded>0 || q.emptyRecv>0 || q.newRecv>0 ||
              q.racksOut>0 || q.truckloads>0);
  if(q.removed > 0 && rack) return STREAMS[3];
  if(q.removed > 0) return STREAMS[2];
  if(q.reinstalled > 0) return STREAMS[0];
  if(rack) return STREAMS[1];
  return STREAMS[4];
}
function streamOf(r){ r = r||R; return r.stream || streamAuto(r); }
function streamLabel(s){ return lang === "es" ? (STREAM_ES[s] || s) : s; }

/* ---- generated notes — English, in the tracker's own phrasing, so the
   office pastes and never retypes ---- */
function n0(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function trucksOf(racks){ return Math.ceil(racks / RACKS_PER_TRUCK); }
function workNote(r){
  var q = r.q, s = [];
  if(q.removed > 0)      s.push("Module removal — removed " + n0(q.removed) + " modules.");
  if(q.reinstalled > 0)  s.push("Module installation — continued installation of new modules on site; " + n0(q.reinstalled) + " modules installed.");
  if(q.assembled > 0)    s.push("Returnable rack assembly — assembled " + n0(q.assembled) + " racks.");
  if(q.racksLoaded > 0 || q.modsLoaded > 0){
    if(q.racksLoaded > 0 && q.modsLoaded > 0)
      s.push("Returnable rack loading — loaded " + n0(q.modsLoaded) + " modules into " + n0(q.racksLoaded) + " returnable racks; staged for load-out.");
    else if(q.racksLoaded > 0)
      s.push("Returnable rack loading — " + n0(q.racksLoaded) + " racks filled and staged for load-out.");
    else
      s.push("Returnable rack loading — loaded " + n0(q.modsLoaded) + " modules into returnable racks.");
  }
  if(q.racksOut > 0){
    var tr = trucksOf(q.racksOut);
    s.push("Truck load-out — loaded " + tr + " truck" + (tr === 1 ? "" : "s") + " with filled returnable racks for return (" + n0(q.racksOut) + " racks).");
  }
  if(q.emptyRecv > 0)    s.push("Material receiving — received " + n0(q.emptyRecv) + " returnable racks; offloaded and staged.");
  if(q.truckloads > 0 || q.newRecv > 0){
    var t = q.truckloads;
    s.push("Material receiving — received " + (t ? t + " truckload" + (t === 1 ? "" : "s") + " of new modules" : "new modules") +
           (q.newRecv ? " (" + n0(q.newRecv) + " modules)" : "") + "; offloaded and staged on site.");
  }
  if(!s.length) s.push(r.men > 0 ? "No production quantities reported for the day." : "No work reported.");
  return s.join(" ");
}
function equipNote(r){
  var q = r.q, s = [];
  if(q.emptyRecv > 0) s.push("Returnable racks — " + n0(q.emptyRecv) + " racks received and offloaded on site.");
  if(q.truckloads > 0 || q.newRecv > 0){
    var p = pallets(q.newRecv);
    s.push("New modules — " + (q.truckloads ? q.truckloads + " truckload" + (q.truckloads === 1 ? "" : "s") + " received and offloaded on site" : "received and offloaded on site") +
           (q.newRecv ? (p ? " (" + p + " pallet boxes at 44 modules per box = " + n0(q.newRecv) + " modules)" : " (" + n0(q.newRecv) + " modules)") : ". Module count per truckload not yet reported") + ".");
  }
  return s.length ? s.join(" ") : "None reported.";
}
function safetyNote(r){
  var s = [];
  s.push("Morning pre-task briefing held with full crew prior to site entry; day's scope and job-specific safety expectations reviewed.");
  s.push(r.jha === "Y" ? "JHA reviewed and signed by all crew members before start of work." : "JHA NOT signed before start of work — follow up required.");
  s.push(r.ppe === "Y" ? "PPE inspection completed for all " + r.men + " crew members; all verified with correct, proper PPE." : "PPE inspection NOT completed — follow up required.");
  s.push(r.hk === "Y" ? "Housekeeping performed daily." : "Housekeeping NOT performed.");
  var inc = (r.near||0) + (r.rec||0) + (r.inj||0);
  s.push(inc ? "See Delays, Issues & Notes for the incident record." : "All site safety procedures followed correctly, with no deviations observed.");
  s.push((r.near||0) + " near misses, " + (r.rec||0) + " recordable incidents, " + (r.inj||0) + " injuries.");
  return s.join(" ");
}
function delayNote(r){
  var s = [];
  if(r.prob){
    var x = reasonOf(r.code);
    var lab = x ? (x[0] + " · " + x[2]) : "ISSUE";
    var extra = (r.note || "").replace(/\s+/g, " ").trim();
    s.push(lab + (r.lost ? " — " + fmt(r.lost) + " hrs lost" : "") + (extra ? " — " + extra : "") + ".");
  }
  var inc = (r.near||0) + (r.rec||0) + (r.inj||0);
  if(inc) s.push("Safety: " + (r.near||0) + " near miss(es), " + (r.rec||0) + " recordable(s), " + (r.inj||0) + " injury/first-aid case(s) — details in the Daily Field Report.");
  return s.length ? s.join(" ") : "No delays, issues, or notes to report.";
}

function loadReports(){
  if(!db) return;
  db.collection(COL).orderBy("ts","desc").limit(400).get().then(function(snap){
    reports = snap.docs.map(function(d){
      var o = {}; var raw = d.data();
      for(var k in raw) o[k] = raw[k];
      o.id = d.id; return o;
    });
    if(screen === "sup") render();
  }).catch(function(){ });
  db.doc(ADMIN + "/settings").get().then(function(d){
    if(d && d.exists && d.data().firstReportNo) firstNo = Number(d.data().firstReportNo) || FIRST_REPORT_NO;
  }).catch(function(){});
}
function sha(txt){
  if(!(window.crypto && crypto.subtle)) return Promise.resolve("plain:"+txt);
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode("peoria:"+txt))
    .then(function(b){ return Array.prototype.map.call(new Uint8Array(b),
      function(x){ return ("0"+x.toString(16)).slice(-2); }).join(""); });
}
function checkPin(pin){
  return sha(pin).then(function(h){
    if(!db) return pin === "2019";
    return db.doc(ADMIN + "/pin").get().then(function(d){
      var stored = d && d.exists ? d.data().hash : null;
      if(!stored) return pin === "2019";
      return stored === h;
    }).catch(function(){ return pin === "2019"; });
  });
}

var ORDER = ["who","weather","people","shift","work","safety","incident","prob","review"];

function goBack(){
  if(screen === "work" && sub){ sub = null; draft = null; render(); return; }
  if(screen === "lost"){ go("prob"); return; }
  if(screen === "stream"){ go("review"); return; }
  if(screen === "prob" && R.prob === true){ R.prob = null; R.code = ""; render(); return; }
  if(screen === "incident" && R.inc === true){ R.inc = null; render(); return; }
  var i = ORDER.indexOf(screen);
  if(i > 0){ go(ORDER[i-1]); return; }
  go("home");
}

function setBot(items){
  bot.innerHTML = "";
  if(!items || !items.length){ bot.hidden = true; return; }
  bot.hidden = false;
  items.forEach(function(b){ bot.appendChild(b); });
}

function render(){
  var t = T[lang];
  langBtn.textContent = t.other;
  main.innerHTML = "";
  main.className = "";

  var stepOf = screen === "lost" ? "prob" : screen === "stream" ? "review" : screen;
  var step = ORDER.indexOf(stepOf);
  backBtn.style.visibility = (screen === "home" || screen === "sent") ? "hidden" : "visible";
  crumb.textContent = step >= 0 ? (lang === "es" ? "Paso " : "Step ") + (step+1) + (lang==="es"?" de ":" of ") + ORDER.length
                    : (screen === "sup" || screen === "pin") ? t.supervisor : "";

  ({home:vHome, who:vWho, weather:vWeather, people:vPeople, shift:vShift, work:vWork,
    safety:vSafety, incident:vIncident, prob:vProb, lost:vLost, stream:vStream,
    review:vReview, sent:vSent, signin:vSignin, sentlink:vSentlink, pin:vPin, sup:vSup}[screen] || vHome)(t);
}

function tell(msg, kind){
  if(!msg) return;
  var d = el("div", "tell" + (kind ? " " + kind : ""), msg);
  main.appendChild(d);
}
function labelled(text, node){
  var w = el("div");
  w.appendChild(cap(text));
  w.appendChild(node);
  return w;
}
function cap(text){
  var c = el("div", null, text);
  c.style.cssText = "font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px";
  return c;
}
function nextBar(t, fn){ setBot([ btn("go", t.next, fn) ]); }
function stepper(label, val, stepv, min, max, set, presets){
  var w = el("div");
  if(label) w.appendChild(cap(label));
  if(presets){
    var cs = el("div","chips");
    cs.style.marginBottom = "10px";
    presets.forEach(function(p){
      cs.appendChild(btn("chip" + (val === p ? " sel" : ""), String(p), function(){ set(p); }));
    });
    w.appendChild(cs);
  }
  var s = el("div","step");
  s.appendChild(btn(null, "−", function(){ set(Math.max(min, Math.round((val-stepv)*10)/10)); }));
  var v = el("div","val", fmt(val));
  s.appendChild(v);
  s.appendChild(btn(null, "+", function(){ set(Math.min(max, Math.round((val+stepv)*10)/10)); }));
  w.appendChild(s);
  return w;
}
function fmtDay(iso){
  if(!iso) return "";
  var p = iso.split("-");
  var dt = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  try{
    return dt.toLocaleDateString(lang === "es" ? "es-MX" : "en-US",
      {weekday:"long", day:"numeric", month:"long"});
  }catch(e){ return iso; }
}
/* m/d/yyyy — what Excel (US) turns into a real date on paste. ISO text would
   silently zero every SUMIFS on the Weekly Tracker Backup. */
function fmtUS(iso){ var p = iso.split("-"); return Number(p[1]) + "/" + Number(p[2]) + "/" + p[0]; }

function unitWord(u){
  if(u === "rack") return "racks";
  if(u === "truck") return lang === "es" ? "camiones" : "trucks";
  return lang === "es" ? "módulos" : "modules";
}
function vQty(t){
  var x = qtyOf(draft.k);
  main.appendChild(el("h1","q", t.howMany));
  main.appendChild(el("p","hint", x[lang] + (x.hint ? " · " + x.hint : "")));

  var n = el("input","num big-num");
  n.type = "text"; n.inputMode = "numeric"; n.pattern = "[0-9]*";
  n.value = draft.q ? String(draft.q) : "";
  n.placeholder = "0";
  n.addEventListener("input", function(){
    n.value = n.value.replace(/[^0-9]/g, "");
    draft.q = Number(n.value || 0);
    checkQty();
  });
  /* Presets ADD. Counting modules you go up in fifties all afternoon; a
     button that jumps TO fifty throws the count away. */
  function bump(by){
    draft.q = Math.max(0, (draft.q || 0) + by);
    n.value = draft.q ? String(draft.q) : "";
    blockMsg = "";
    checkQty();
  }
  var row = el("div","step qty");
  row.appendChild(btn(null, "−", function(){ bump(-1); }));
  row.appendChild(n);
  row.appendChild(btn(null, "+", function(){ bump(1); }));
  main.appendChild(labelled(t.qty + " (" + unitWord(x.unit) + ")", row));

  /* Warn, never block — 5,300 modules installed in one day should not pass
     without anyone noticing, but a foreman occasionally has a reason. */
  var warn = el("div","tell"); warn.hidden = true; main.appendChild(warn);
  function checkQty(){
    var over = x.max && draft.q > x.max;
    warn.hidden = !over;
    if(over) warn.textContent = t.tooMany.replace("{q}", n0(draft.q)).replace("{n}", n0(x.max));
  }
  var pad = el("div","grid three");
  x.presets.forEach(function(k){ pad.appendChild(btn("big plus", "+" + n0(k), function(){ bump(k); })); });
  pad.appendChild(btn("big clear", t.clear, function(){ draft.q = 0; n.value = ""; blockMsg = ""; checkQty(); }));
  main.appendChild(pad);
  checkQty();

  setBot([ btn("go", t.done, function(){
    var old = R.q[x.k];
    R.q[x.k] = draft.q || 0;
    /* Racks filled → modules loaded, 44 per rack, unless the foreman already
       typed a figure of his own. Shown on the list so it is never silent. */
    if(x.link){
      var was = R.q[x.link];
      if(!was || was === old * MODULES_PER_RACK){
        R.q[x.link] = R.q[x.k] * MODULES_PER_RACK;
        if(R.q[x.k] > 0) linkedMsg = t.linked.replace("{r}", n0(R.q[x.k]));
      }
    }
    draft = null; zeroOK = false;
    go("work");
  })]);
}

/* The document that leaves the phone. Flat, one per report, every Input
   column already spelled out so the CSV and the sheet script are just
   column pickers. */
function buildDoc(){
  var q = R.q;
  return {
    date:R.date, ts:Date.now(), time:siteTime(new Date()), tz:TZ, project:PROJECT,
    foreman:R.foreman.trim(), status:"Submitted", stream:streamOf(), area:BLOCK_AREA, weather:R.weather,
    men:R.men, start:clock12(R.start), end:clock12(R.end), shift:shiftHrs(), total:totalHrs(),
    removed:q.removed, reinstalled:q.reinstalled, emptyRecv:q.emptyRecv, assembled:q.assembled,
    racksLoaded:q.racksLoaded, modsLoaded:q.modsLoaded, newRecv:q.newRecv,
    racksOut:q.racksOut, truckloads:q.truckloads,
    jha:R.jha, ppe:R.ppe, hk:R.hk, near:R.near||0, rec:R.rec||0, inj:R.inj||0,
    prob:!!R.prob, code:R.code||"", lost:R.lost||0, note:(R.note||"").replace(/\s+/g," ").trim(),
    equipNote:equipNote(R), workNote:workNote(R), safetyNote:safetyNote(R), delayNote:delayNote(R),
    build:BUILD
  };
}

function send(){
  if(busy) return;
  busy = true; render();
  var doc = buildDoc();
  lsSet(LAST, {date:R.date, foreman:R.foreman, men:R.men, start:R.start, end:R.end});
  var id = R.date + "-" + Math.random().toString(36).slice(2,8);

  outAdd(id, doc);
  postSheet(id, doc);

  /* Fire and move on. With offline persistence the promise does NOT resolve
     until the server confirms, so awaiting it would hang the foreman on a
     spinner every time he is in a dead spot. Firestore holds the write and
     sends it when the signal comes back; the outbox entry clears only when
     the server actually acknowledges it. */
  if(db){
    try{
      db.doc(COL + "/" + id).set(doc).then(function(){ outDone(id); outErr = ""; })
        .catch(function(e){ outErr = errCode(e); });
    }catch(e){}
  }
  busy = false;
  go("sent");
}

/* ================= CSV — the Input tab, column for column =================
   Header row 1 = the field tracker's Input row 4. Data rows sorted oldest
   first and numbered from firstNo, so the office selects from row 2 down and
   pastes at Input!A18. Column L (Total Man-Hours) is a formula on Input; the
   CSV carries the same H×K figure so the paste changes nothing the roll-ups
   read.

   32 columns. A–S and V–AF are the field file's headers as mirrored in the
   Executive Peoria Tracker. T and U are the two columns the field file added
   after New Modules Received (racks shipped out on 08/10, 08/13, 08/14 and
   truckloads on 08/12, 08/13 prove their positions); their header TEXT is
   inferred — fix these two strings if the field file words them differently.
   Order and position are what the roll-ups read; the header row is only a
   guide for the eye. */
var INPUT_HEAD = ["Date","Report #","Report Status","Crew / Work Stream","Site Supervisor","Block / Area",
  "Weather / Site Conditions","Crew Size (Headcount)","Start Time","Release Time","Shift Length (Hrs)","Total Man-Hours",
  "Modules Removed Today","Modules Reinstalled Today","Returnable Racks Received Today","Returnable Racks Assembled Today",
  "Returnable Racks Loaded (Ready for Return) Today","Modules Loaded into Returnable Racks Today","New Modules Received Today",
  "Returnable Racks Loaded Out for Return Today",   /* T — INFERRED header text */
  "New Module Truckloads Received Today",           /* U — INFERRED header text */
  "Pre-Task Briefing / JHA Signed (Y/N)","PPE Inspection Completed (Y/N)","Housekeeping Performed (Y/N)",
  "Near Misses","Recordable Incidents","Injuries / First Aid",
  "Equipment & Materials Received Notes","Work Performed / Activities Completed","Safety Notes / Observations",
  "Delays, Issues & Notes","Data Anomaly Flag"];
function inputRow(r, no){
  return [fmtUS(r.date), no, r.status || "Submitted", r.stream || "", r.foreman || "", r.area || BLOCK_AREA,
    r.weather || "", r.men, r.start, r.end, r.shift, r.total,
    r.removed||0, r.reinstalled||0, r.emptyRecv||0, r.assembled||0, r.racksLoaded||0, r.modsLoaded||0, r.newRecv||0,
    r.racksOut||0, r.truckloads||0,
    r.jha, r.ppe, r.hk, r.near||0, r.rec||0, r.inj||0,
    r.equipNote||"", r.workNote||"", r.safetyNote||"", r.delayNote||"", ""];
}
function csvText(list, first){
  var sorted = list.slice().sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts||0) - (b.ts||0); });
  var rows = [INPUT_HEAD];
  sorted.forEach(function(r, i){ rows.push(inputRow(r, first + i)); });
  return rows.map(function(r){
    return r.map(function(c){
      c = String(c == null ? "" : c);
      return /[",\n\r]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c;
    }).join(",");
  }).join("\r\n");
}
function csv(){
  var text = csvText(reports, firstNo);
  var name = "peoria-input-" + today() + ".csv";
  if(dl){ dl.save({filename:name, data:text}).catch(function(){}); return; }
  try{
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff" + text], {type:"text/csv;charset=utf-8"}));
    a.download = name; a.click();
  }catch(e){}
}

function changePin(){

/* ================= Firebase =================
   NEW PROJECT FOR PEORIA. Paste the web-app config from
   Firebase console → Project settings → Your apps → SDK setup and configuration.
   Leave SHEET_URL empty until the Apps Script is deployed; the app skips the
   sheet cleanly. TOKEN must match the one in Code.gs. Neither is a secret —
   both ship in this file — so the sheet is a MIRROR and Firestore stays the
   source of truth. */
var SHEET_URL = "";
var SHEET_TOKEN = "peoria-2026-Xm4tR9";

var FB = {
  apiKey: "AIzaSyCN_sCKbmbFNNOFn1wC8W-MnUkQvQwTlqE",
  authDomain: "peoria-643f6.firebaseapp.com",
  projectId: "peoria-643f6",
  storageBucket: "peoria-643f6.firebasestorage.app",
  messagingSenderId: "603804357926",
  appId: "1:603804357926:web:9d9b05605062be9f091de7"
};

var auth = null, user = null, sdkFailed = false, noCfg = !FB.projectId;
var EMAILKEY = KEY+"email";

/* THE SHEET QUEUE — its own box, cleared on its own signal.
   If the sheet POST rode on the Firebase outbox, Firestore's offline sync
   could clear the entry while the POST was still failing, and nothing would
   remember the sheet was owed. no-cors means the reply cannot be read, but the
   promise REJECTS when the request never left the phone and RESOLVES when it
   did — enough to drive a retry queue. */
var SBOX = KEY+"sheetbox";
function sbGet(){ try{ return JSON.parse(localStorage.getItem(SBOX) || "[]"); }catch(e){ return []; } }
function sbPut(box){ try{ localStorage.setItem(SBOX, JSON.stringify(box.slice(-120))); }catch(e){} }
function sbAdd(id, doc){
  var box = sbGet();
  for(var i=0;i<box.length;i++) if(box[i].id === id) return;
  box.push({id:id, doc:doc, at:Date.now()});
  sbPut(box);
}
function sbDone(id){
  var box = sbGet(), keep = [];
  for(var i=0;i<box.length;i++) if(box[i].id !== id) keep.push(box[i]);
  sbPut(keep);
}
function sbCount(){ return sbGet().length; }
function sendSheet(id, doc){
  if(!SHEET_URL) return;
  try{
    fetch(SHEET_URL, {
      method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({token:SHEET_TOKEN, id:id, doc:doc})
    }).then(function(){ sbDone(id); if(screen === "sup") render(); })
      .catch(function(){ /* never left the phone — stays queued */ });
  }catch(e){}
}
function postSheet(id, doc){
  if(!SHEET_URL) return;
  sbAdd(id, doc);
  sendSheet(id, doc);
}
var lastSheetFlush = 0;
function flushSheet(force){
  if(!SHEET_URL) return;
  var box = sbGet();
  if(!box.length) return;
  var now = Date.now();
  if(!force && now - lastSheetFlush < 8000) return;
  lastSheetFlush = now;
  box.forEach(function(e){ sendSheet(e.id, e.doc); });
}

/* THE OUTBOX — a report stays here from the moment it is filed until the
   server confirms it. An entry leaves only on a real acknowledgement. */
var OUTBOX = KEY+"outbox";
function outGet(){ try{ return JSON.parse(localStorage.getItem(OUTBOX) || "[]"); }catch(e){ return []; } }
function outPut(box){ try{ localStorage.setItem(OUTBOX, JSON.stringify(box.slice(-60))); }catch(e){} }
function outAdd(id, doc){
  var box = outGet();
  for(var i=0;i<box.length;i++) if(box[i].id === id) return;
  box.push({id:id, doc:doc});
  outPut(box);
}
function outDone(id){
  var box = outGet(), keep = [];
  for(var i=0;i<box.length;i++) if(box[i].id !== id) keep.push(box[i]);
  outPut(keep);
}
function outCount(){ return outGet().length; }

/* Four triggers: start, online, visibilitychange, timer. "online" fires only
   on an offline→online transition, so a phone already online at boot never
   fires it — one failed attempt at start and the queue would sit forever. */
var lastFlush = 0, outErr = "";
function errCode(e){ return (e && (e.code || e.message)) ? String(e.code || e.message) : "error"; }
/* The Firestore error codes a new project actually produces, in words the
   person setting it up can act on. The raw code stays on the end. */
function explainErr(code, t){
  var c = String(code || "").toLowerCase(), why = "";
  if(c.indexOf("permission") >= 0) why = t.errRules;
  else if(c.indexOf("not-found") >= 0 || c.indexOf("failed-precondition") >= 0 || c.indexOf("database") >= 0) why = t.errNoDb;
  else if(c.indexOf("unavailable") >= 0 || c.indexOf("network") >= 0 || c.indexOf("deadline") >= 0) why = t.errNet;
  else if(c === "sdk") why = t.noSdk;
  return why ? why + " (" + code + ")" : code;
}
function flushOutbox(force){
  if(!db){ if(outGet().length) outErr = "sdk"; return; }
  var box = outGet();
  if(!box.length){ outErr = ""; return; }
  var now = Date.now();
  if(!force && now - lastFlush < 8000) return;
  lastFlush = now;
  box.forEach(function(entry){
    try{
      db.doc(COL + "/" + entry.id).set(entry.doc).then(function(){
        outDone(entry.id); outErr = "";
        if(screen === "home" || screen === "sup") render();
      }).catch(function(e){
        outErr = errCode(e);
        if(screen === "sup" || screen === "home") render();
      });
    }catch(e){ outErr = String((e && e.message) || e); }
  });
}

function startFirebase(){
  if(!window.firebase || !firebase.initializeApp){ sdkFailed = true; render(); return; }
  if(noCfg){ render(); return; }
  try{
    firebase.initializeApp(FB);
    db = firebase.firestore();
    db.enablePersistence({synchronizeTabs:true}).catch(function(){});
    flushOutbox();
    flushSheet(true);
    auth = firebase.auth();
    auth.onAuthStateChanged(function(u){
      user = u || null;
      if(user && screen === "sup") loadReports();
      render();
    });
    finishEmailLink();
  }catch(e){ sdkFailed = true; }
  render();
}
function sendLink(email){
  if(!auth) return Promise.reject();
  try{ localStorage.setItem(EMAILKEY, email); }catch(e){}
  return auth.sendSignInLinkToEmail(email, { url: location.origin + location.pathname, handleCodeInApp: true });
}
function finishEmailLink(){
  if(!auth || !auth.isSignInWithEmailLink(location.href)) return;
  var email = "";
  try{ email = localStorage.getItem(EMAILKEY) || ""; }catch(e){}
  if(!email) email = window.prompt(T[lang].confirmEmail) || "";
  if(!email) return;
  auth.signInWithEmailLink(email, location.href).then(function(){
    history.replaceState(null, "", location.pathname);
    pinOK = false; go("pin");
  }).catch(function(){ pinMsg = T[lang].linkBad; go("signin"); });
}

/* ================= start ================= */
render();
startFirebase();
window.addEventListener("online",  function(){ flushOutbox(true); flushSheet(true); render(); });
window.addEventListener("offline", render);
document.addEventListener("visibilitychange", function(){
  if(document.hidden) return;
  if(outCount()) flushOutbox(true);
  if(sbCount()) flushSheet(true);
});
setInterval(function(){
  if(outCount()) flushOutbox();
  if(sbCount()) flushSheet();
}, 20000);

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

/* test hook — harmless in production, lets the headless check read state */
window.__app = { csvText:csvText, buildDoc:function(){ return R ? buildDoc() : null; },
  outCount:outCount, sbCount:sbCount, flushOutbox:flushOutbox, flushSheet:flushSheet, streamAuto:function(){ return R ? streamAuto(R) : ""; } };
})();
